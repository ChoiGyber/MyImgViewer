[package]
name = "myimgviewer"
version = "1.0.0"
description = "MyImgViewer - Simple Image Viewer"
authors = ["you"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
image = { version = "0.25", features = ["jpeg", "png", "gif", "webp", "tiff", "bmp", "avif"] }
base64 = "0.22"
trash = "5"
glob = "0.3"
natord = "1.0"
arboard = "3"
screenshots = "0.8"
xcap = "0.9"
tauri-plugin-single-instance = "2"
dirs = "6"
opener = "0.7"
rand = "0.8"
