appId: com.myimgviewer
productName: MyImgViewer
directories:
  buildResources: resources
files:
  - out/**
  - resources/**
  - '!node_modules/pretendard/**'
asarUnpack:
  - resources/**
  - node_modules/sharp/**
  - node_modules/@img/**
electronLanguages:
  - ko
  - en-US
fileAssociations:
  - ext:
      - jpg
      - jpeg
      - jpe
      - jfif
      - pjpeg
      - pjp
    name: JPEG Image
    description: JPEG Image
    mimeType: image/jpeg
    role: Viewer
    rank: Default
  - ext:
      - png
      - apng
    name: PNG Image
    description: PNG Image
    mimeType: image/png
    role: Viewer
    rank: Default
  - ext: webp
    name: WebP Image
    description: WebP Image
    mimeType: image/webp
    role: Viewer
    rank: Default
  - ext: avif
    name: AVIF Image
    description: AVIF Image
    mimeType: image/avif
    role: Viewer
    rank: Default
  - ext:
      - tiff
      - tif
    name: TIFF Image
    description: TIFF Image
    mimeType: image/tiff
    role: Viewer
    rank: Default
  - ext: gif
    name: GIF Image
    description: GIF Image
    mimeType: image/gif
    role: Viewer
    rank: Default
  - ext:
      - bmp
      - dib
    name: BMP Image
    description: BMP Image
    mimeType: image/bmp
    role: Viewer
    rank: Default
  - ext: svg
    name: SVG Image
    description: SVG Image
    mimeType: image/svg+xml
    role: Viewer
    rank: Default
  - ext: ico
    name: Icon Image
    description: Icon Image
    mimeType: image/x-icon
    role: Viewer
    rank: Default
  - ext:
      - heic
      - heics
    name: HEIC Image
    description: HEIC Image
    mimeType: image/heic
    role: Viewer
    rank: Default
  - ext:
      - heif
      - heifs
      - hif
    name: HEIF Image
    description: HEIF Image
    mimeType: image/heif
    role: Viewer
    rank: Default
win:
  executableName: MyImgViewer
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: MyImgViewer
  uninstallDisplayName: MyImgViewer
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
compression: maximum
